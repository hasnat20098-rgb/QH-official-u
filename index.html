<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LYRA BOT V4 FINAL CLEAN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding:10px}
.top{background:#111;border:1px solid #00ff00;border-radius:12px;padding:12px;text-align:center}
.top b{color:#00ff00;font-size:18px}
.search{width:100%;padding:13px;background:#000;color:#fff;border:1px solid #00ff00;border-radius:12px;margin-top:10px}
.sug{background:#111;border:1px solid #00ff00;border-radius:12px;margin-top:6px;max-height:200px;overflow-y:auto;display:none}
.sug div{padding:11px;border-bottom:1px solid #222;cursor:pointer}
.live{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin-top:10px;text-align:center}
#price{font-size:32px;font-weight:900;color:#00ff00}
.tlc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.tlcBox{background:#111;border:1px solid #333;border-radius:12px;padding:10px;text-align:center;font-size:12px}
.ok{border-color:#00ff00!important}.notok{border-color:#ff0000!important}.wait{border-color:#ffaa00!important}
.signalBox{margin-top:10px;border-radius:14px;padding:14px;text-align:center;font-weight:900}
.sig-good{background:#003d1a;border:1px solid #00ff00;color:#00ff00}
.sig-bad{background:#3d0000;border:1px solid #ff0000;color:#ff4444}
.sig-wait{background:#3d2a00;border:1px solid #ffaa00;color:#ffaa00}
.btn{width:100%;padding:13px;border:none;border-radius:25px;font-weight:900;margin-top:10px}
.start{background:#00ff00;color:#000}.stop{background:#222;color:#fff;border:1px solid #555}
</style></head><body>
<div class="top"><b>LYRA BOT V4 ✅ CLEAN</b><br><span style="font-size:11px;color:#aaa">10 Real Proxy + 14 Bug Fixed + Unlimited</span></div>
<input class="search" id="searchInp" placeholder="🔍 GOLD, EUR/USD, BTC লিখো..." oninput="yahooSearch()">
<div class="sug" id="sugBox"></div>
<p id="proxyInfo" style="font-size:10px;color:#00ff00;text-align:center;margin-top:6px">Proxy: Ready - 10 Real</p>
<p id="currentTxt" style="font-size:12px;color:#aaa;text-align:center;margin-top:6px">মার্কেট: <b style="color:#00ff00">EUR/USD</b></p>
<div class="live"><div id="price">Loading...</div><p id="candleInfo" style="font-size:11px;color:#aaa">V4 Fixed Loading...</p></div>
<div class="tlc">
<div class="tlcBox wait" id="boxT"><small>T TREND</small><b id="tVal">--</b><p id="tTxt">...</p></div>
<div class="tlcBox wait" id="boxL"><small>L LIQUIDITY</small><b id="lVal">--</b><p id="lTxt">...</p></div>
<div class="tlcBox wait" id="boxC"><small>C CONFIRM</small><b id="cVal">--</b><p id="cTxt">...</p></div>
</div>
<div id="signalBox" class="signalBox sig-wait">🟡 TLC অপেক্ষা...</div>
<div id="detailBox" style="background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin-top:10px;font-size:12px">V4 Ready</div>
<button class="btn start" id="mainBtn" onclick="toggleApp()">▶️ BOT START</button>
<script>
let current={n:"EUR/USD",s:"EURUSD=X"},running=false,timerIv=null,lastPrice=0,isFetching=false,cache={},cacheTime={};
// 10 REAL UNIQUE PROXY - NO DUPLICATE
const PROXY_LIST=[
"https://api.allorigins.win/raw?url=",
"https://api.allorigins.win/get?url=",
"https://corsproxy.io/?",
"https://api.codetabs.com/v1/proxy?quest=",
"https://thingproxy.freeboard.io/fetch/",
"https://cors.bridged.cc/",
"https://proxy.cors.sh/",
"https://yacdn.org/proxy/",
"https://api.cors.lol/?url=",
"https://corsproxy.org/?"
];
let proxyIndex=0;
async function fetchWithProxy(url){
 if(cache[url] && Date.now()-cacheTime[url]<45000){document.getElementById('proxyInfo').innerText="Proxy: Cache ✅";return cache[url];}
 for(let i=0;i<PROXY_LIST.length;i++){
   let pUrl=PROXY_LIST[proxyIndex]+encodeURIComponent(url);
   proxyIndex=(proxyIndex+1)%PROXY_LIST.length;
   document.getElementById('proxyInfo').innerText="Proxy: Trying "+(proxyIndex+1)+"/10 - "+PROXY_LIST[proxyIndex].split('/')[2];
   try{
     let ctrl=new AbortController();setTimeout(()=>ctrl.abort(),5000);
     let r=await fetch(pUrl,{signal:ctrl.signal});
     if(!r.ok) continue;
     let txt=await r.text(),data;
     try{data=JSON.parse(txt);if(data.contents) data=JSON.parse(data.contents);}catch(e){data=JSON.parse(txt);}
     if(data.chart||data.quotes){cache[url]=data;cacheTime[url]=Date.now();document.getElementById('proxyInfo').innerText="Proxy: Success #"+(proxyIndex+1)+" ✅";return data;}
   }catch(e){continue;}
 }
 throw new Error("fail");
}
function calcEMA(closes,period){
 let v=closes.filter(x=>x!=null&&x!=undefined);if(v.length<period) return v[v.length-1];
 let sma=v.slice(0,period).reduce((a,b)=>a+b,0)/period,k=2/(period+1),ema=sma;
 for(let i=period;i<v.length;i++) ema=v[i]*k+ema*(1-k);return ema;
}
function calcATR(h,l,c,p=14){let trs=[];for(let i=1;i<h.length;i++) trs.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));return trs.slice(-p).reduce((a,b)=>a+b,0)/p;}
async function fetchYahoo(s,r,interval){let url=`https://query1.finance.yahoo.com/v8/finance/chart/${s}?range=${r}&interval=${interval}`;let d=await fetchWithProxy(url);return d.chart.result[0];}
async function yahooSearch(){
 let q=document.getElementById('searchInp').value.trim(),box=document.getElementById('sugBox');
 if(q.length<2){box.style.display='none';return;}box.style.display='block';box.innerHTML='<div>🔍 খুঁজতেছি...</div>';
 try{
  let url=`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=10&newsCount=0`;
  let d=await fetchWithProxy(url),quotes=d.quotes||[];if(!quotes.length){box.innerHTML='<div>পাই নাই</div>';return;}
  box.innerHTML='';quotes.forEach(qt=>{
   let div=document.createElement('div');div.innerHTML='<b>'+qt.symbol+'</b><br><span style="font-size:11px;color:#aaa">'+(qt.shortname||'')+'</span>';
   div.onclick=()=>{current={n:qt.shortname||qt.symbol,s:qt.symbol};document.getElementById('currentTxt').innerHTML='মার্কেট: <b style="color:#00ff00">'+current.n+'</b>';document.getElementById('searchInp').value='';box.style.display='none';doTLC();};box.appendChild(div);
  });
 }catch(e){box.innerHTML='<div>Error, আবার লিখো</div>';}
}
async function doTLC(){
 if(isFetching) return;isFetching=true;
 try{
  let r1h=await fetchYahoo(current.s,"5d","1h"),q1h=r1h.indicators.quote[0],c1h=q1h.close.filter(x=>x),lastP=c1h[c1h.length-1];lastPrice=lastP;
  let ema50=calcEMA(c1h,50),ema200=calcEMA(c1h,200),trend=(ema50>ema200&&lastP>ema50)?"UPTREND":(ema50<ema200&&lastP<ema50)?"DOWNTREND":"SIDEWAYS";
  let r15=await fetchYahoo(current.s,"2d","15m"),q15=r15.indicators.quote[0],closes15=q15.close.filter(x=>x),lows15=q15.low.filter(x=>x),highs15=q15.high.filter(x=>x);
  let prevLow=Math.min(...lows15.slice(-22,-2)),prevHigh=Math.max(...highs15.slice(-22,-2)),lastLow=lows15[lows15.length-1],lastHigh=highs15[highs15.length-1],lastClose15=closes15[closes15.length-1],atrTemp=calcATR(highs15,lows15,closes15,14);
  let sweepLow=lastLow<prevLow&&lastClose15>prevLow&&(prevLow-lastLow)>atrTemp*0.3,sweepHigh=lastHigh>prevHigh&&lastClose15<prevHigh&&(lastHigh-prevHigh)>atrTemp*0.3,liq=sweepLow?"SWEEP LOW ✅":sweepHigh?"SWEEP HIGH ✅":"NO SWEEP ❌";
  let r5=await fetchYahoo(current.s,"1d","5m"),q5=r5.indicators.quote[0],o5=q5.open.filter(x=>x),c5=q5.close.filter(x=>x),h5=q5.high.filter(x=>x),l5=q5.low.filter(x=>x),atr5=calcATR(h5,l5,c5,14);
  let lastO=o5[o5.length-1],lastC5=c5[c5.length-1],prevO=o5[o5.length-2],prevC=c5[c5.length-2],bodyCurr=Math.abs(lastC5-lastO),bodyPrev=Math.abs(prevC-prevO);
  let bullEng=lastC5>lastO&&prevC<prevO&&lastO<prevC&&lastC5>prevO&&bodyCurr>bodyPrev*1.2,bearEng=lastC5<lastO&&prevC>prevO&&lastO>prevC&&lastC5<prevO&&bodyCurr>bodyPrev*1.2,conf=bullEng?"BULLISH ENGULFING ✅":bearEng?"BEARISH ENGULFING ✅":"NO ENGULFING ❌";
  let dec=current.s.includes("JPY")||current.s.includes("XAU")?3:current.s.includes("BTC")||lastP>1000?2:5;
  document.getElementById('price').innerText=lastP.toFixed(dec);
  document.getElementById('tVal').innerText=trend;document.getElementById('boxT').className='tlcBox '+(trend!="SIDEWAYS"?'ok':'wait');
  document.getElementById('lVal').innerText=liq;document.getElementById('boxL').className='tlcBox '+(liq.includes("✅")?'ok':'notok');
  document.getElementById('cVal').innerText=conf;document.getElementById('boxC').className='tlcBox '+(conf.includes("✅")?'ok':'notok');
  document.getElementById('candleInfo').innerText=trend+" • "+liq+" • "+conf;
  let box=document.getElementById('signalBox'),detail=document.getElementById('detailBox'),sl,tp;
  if(trend=="UPTREND"&&sweepLow&&bullEng){sl=lastP-atr5*1.5;tp=lastP+atr5*2;box.innerText="✅ BUY "+lastP.toFixed(dec)+" SL:"+sl.toFixed(dec)+" TP:"+tp.toFixed(dec);box.className="signalBox sig-good";detail.innerHTML="✅ BUY<br>ATR SL/TP";}
  else if(trend=="DOWNTREND"&&sweepHigh&&bearEng){sl=lastP+atr5*1.5;tp=lastP-atr5*2;box.innerText="⛔ SELL "+lastP.toFixed(dec)+" SL:"+sl.toFixed(dec)+" TP:"+tp.toFixed(dec);box.className="signalBox sig-bad";detail.innerHTML="⛔ SELL<br>ATR SL/TP";}
  else{box.innerText="🟡 WAIT - TLC মিলে নাই";box.className="signalBox sig-wait";detail.innerHTML="🟡 WAIT<br>T:"+trend+" L:"+liq+" C:"+conf;}
  isFetching=false;
 }catch(e){isFetching=false;document.getElementById('proxyInfo').innerText="Proxy: Retry...";}
}
function toggleApp(){if(!running){running=true;document.getElementById('mainBtn').innerText='⏹️ BANDHO';document.getElementById('mainBtn').className='btn stop';doTLC();timerIv=setInterval(doTLC,60000);}else{running=false;clearInterval(timerIv);document.getElementById('mainBtn').innerText='▶️ BOT START';document.getElementById('mainBtn').className='btn start';}}
doTLC();
</script></body></html>
